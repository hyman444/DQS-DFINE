__include__: [
  '../dfine/dfine_hgnetv2_s_custom.yml',
  '../dataset/visdrone_detection.yml',
  '../base/deim.yml'
]

checkpoint_freq: 24
print_freq: 1750

output_dir: ./outputs/dqs_deim_dfine_s

# yolo_metrice: True

model: DEIM_MG

DEIM_MG:
  yaml_path: configs/cfg-improve/dfine-s-fdpn-test.yaml

  pretrained: weight/hgnetv2/PPHGNetV2_B0_stage1_MG.pth

optimizer:
  type: AdamW
  params: 
    - 
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.0002
    - 
      params: '^(?=.*(?:norm|bn)).*$'     # except bias
      weight_decay: 0.

  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.0001


# Increase to search for the optimal ema
epoches: 160 # 120 + 4n

## Our LR-Scheduler
flat_epoch: 84    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
no_aug_epoch: 12

## Our DataAug
train_dataloader: 
  dataset: 
    transforms:
      policy:
        epoch: [4, 84, 148]   # list 

  collate_fn:
    mixup_epochs: [4, 84]
    stop_epoch: 148
    # base_size_repeat: ~
    base_size_repeat: 20
  total_batch_size: 4
val_dataloader:
  total_batch_size: 8

postprocessor: DQPostProcessor

DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_densitymap: 10, loss_densitycount: 0.2}
  losses: ['vfl', 'boxes', 'local', 'densitymap', 'densitycount']

  density_precision_penalty: 1.1
  density_recall_penalty: 1.3